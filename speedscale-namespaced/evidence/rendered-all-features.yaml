# Source: speedscale-namespaced/templates/replay-runtime-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: speedscale
  namespace: 'speedscale'
  labels:
    example.com/team: platform
    app: speedscale
    controlplane.speedscale.com/component: replay-runtime
  annotations: 
    example.com/owner: platform-team
rules:
# Opt-in, and OFF by default, for the same reason the inspector's identical rule
# is (inspector.metricsEnabled): Kubernetes RBAC escalation prevention forbids
# creating a Role granting a permission the installer does not itself hold, so a
# namespace-admin customer installing this chart cannot create this rule -- and
# on a cluster with no metrics-server the metrics.k8s.io API group does not
# exist, so nobody can. Ungated, this one rule made the whole chart
# uninstallable for its target user.
#
# It is optional in practice anyway: a 403 (or a missing API) must degrade
# report enrichment rather than fail the replay, and that fallback lives in the
# collector/report reader, not here. build.StaticReplayRuntimeRules()
# (lib/kube/build/rbac.go) documents the same optionality; a default render is
# therefore a deliberate subset of that rule list, not drift.
- apiGroups:
  - metrics.k8s.io
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ""
  resources:
  - pods/log
  verbs:
  - get
  - list

