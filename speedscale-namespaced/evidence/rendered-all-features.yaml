    app: speedscale-forwarder
    controlplane.speedscale.com/component: forwarder
  annotations: 
    example.com/owner: platform-team
rules:
# Resolve the local pods and services behind the traffic it forwards, so a
# captured connection can be attributed to a workload rather than an IP.
- apiGroups:
  - ""
  resources:
  - pods
  - services
  verbs:
  - get
  - list
  - watch
# Its own configuration, by name. The DLP and filter ConfigMaps are optional
# mounts the forwarder re-reads without a restart; the operator writes them at
# runtime (S-12539) and this chart lets the forwarder see them if they appear.
- apiGroups:
  - ""
  resourceNames:
  - speedscale-forwarder
  - speedscale-forwarder-dlp
  - speedscale-forwarder-filter
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch

