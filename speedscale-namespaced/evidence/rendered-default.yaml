---
# Source: speedscale-namespaced/templates/uninstall.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: speedscale-uninstall
  namespace: 'speedscale'
  labels:
    app: speedscale
    controlplane.speedscale.com/component: uninstall
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # One retry: the command is idempotent and a crashed run resumes cleanly, so
  # a transient API failure gets a second chance instead of stretching the
  # uninstall to the deadline. forceCleanupOnUninstall is the escape hatch for
  # cleanup that legitimately refuses.
  backoffLimit: 1
  # The process bounds its own work at --timeout and gives itself ~30s beyond
  # it for the capture scan and the force-mode recovery write; the pod deadline
  # sits comfortably above both plus startup.
  activeDeadlineSeconds: 420
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app: speedscale
        controlplane.speedscale.com/component: uninstall
    spec:
      restartPolicy: Never
      serviceAccountName: speedscale-uninstall
      securityContext:
        fsGroup: 2100
        runAsNonRoot: true
        supplementalGroups:
        - 2100
      containers:
      # Contract of `operator namespaced-cleanup` (implemented in the operator
      # binary): cancel non-terminal replay requests, wait until every request
      # is terminal and finalizer-free, then scan capture inventories AND live
      # sidecar mutations; it never patches workloads itself.
      #   --namespace <ns>        the only namespace it may act on
      #   --timeout <duration>    wall-clock budget for the replay wait; the
      #                           process exits within ~30s past it
      #   --force                 strip finalizers and permit uninstall with
      #                           active capture, ONLY after writing the
      #                           speedscale-uninstall-recovery ConfigMap
      #                           (deliberately not Helm-managed, so it
      #                           survives the uninstall as the evidence)
      # Exit codes: 0 safe to uninstall; 1 refused (found active replay
      # cleanup or injected capture - output names the exact uninject command
      # per workload); 2 bad invocation; 3 the check could not be completed.
      # Any non-zero exit fails this Job and blocks `helm uninstall`.
      # An image older than the subcommand exits non-zero too, which blocks
      # uninstall unless uninstall.enabled is turned off.
      - name: cleanup
        image: 'gcr.io/speedscale/operator:v2.5.878'
        imagePullPolicy: 'Always'
        # /app, not /speedscale/operator: every Speedscale image built by
        # tools/build/Dockerfile.default COPYs the binary to the fixed path /app
        # and sets ENTRYPOINT ["/app"] (the entrypoint cannot expand build args,
        # so the binary is renamed on the way in). The operator project has no
        # Dockerfile of its own, so it uses that default. A wrong command path
        # here is invisible until uninstall time and then fails as StartError
        # 128 with zero container logs, leaving the release permanently stuck.
        command:
        - /app
        args:
        - namespaced-cleanup
        - --namespace
        - 'speedscale'
        - --timeout
        - '5m'
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SPEEDSCALE_CLEANUP_TIMEOUT
          value: '5m'
        - name: SPEEDSCALE_FORCE_CLEANUP
          value: "false"
        envFrom:
        - secretRef:
            name: 'speedscale-apikey'
            # The API key Secret may already be gone when a namespace is being
            # torn down wholesale. Cleanup is local work and does not need it.
            optional: true
        resources:
          limits:
            cpu: "1"
            memory: 256M
          requests:
            cpu: 100m
            memory: 64M
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 2100
          runAsNonRoot: true
          runAsUser: 2100
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: speedscale-diagnostics
      volumes:
      - emptyDir: {}
        name: speedscale-diagnostics

