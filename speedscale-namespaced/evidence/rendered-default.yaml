#   * NO workload patch. It cannot touch a Deployment or StatefulSet spec. A
#     half-finished uninstall must not be able to leave a customer workload
#     mid-mutation.
#   * NO deletion of anything. Helm removes the release's own objects; this
#     hook's job is to signal in-flight replays to wind down and to record what
#     was left behind, not to garbage-collect.
rules:
# Signal in-flight replays through the same labeled ConfigMaps the replay API
# uses, and leave a record of anything that could not be wound down.
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
# Read-only visibility to decide whether cleanup finished.
- apiGroups:
  - ""
  resources:
  - pods
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch

---
# Source: speedscale-namespaced/templates/uninstall.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: speedscale-uninstall
  namespace: 'speedscale'
  labels:
    app: speedscale
    controlplane.speedscale.com/component: uninstall
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "3"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: speedscale-uninstall
subjects:
- kind: ServiceAccount
  name: speedscale-uninstall
  namespace: 'speedscale'

---
# Source: speedscale-namespaced/templates/uninstall.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: speedscale-uninstall
  namespace: 'speedscale'
  labels:
    app: speedscale
    controlplane.speedscale.com/component: uninstall
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  # One shot. A retried cleanup that keeps failing just stretches the uninstall
  # out to the deadline; forceCleanupOnUninstall is the supported escape hatch.
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 60
  template:
    metadata:
      annotations:
        sidecar.istio.io/inject: "false"
      labels:
        app: speedscale
        controlplane.speedscale.com/component: uninstall
    spec:
      restartPolicy: Never
      serviceAccountName: speedscale-uninstall
      securityContext:
        fsGroup: 2100
        runAsNonRoot: true
        supplementalGroups:
        - 2100
      containers:
      # ###################################################################
      # PLACEHOLDER ENTRYPOINT -- OWNED BY S-12933.
      #
      # The cleanup logic itself does not exist yet. This chart renders the Job
      # that will invoke it, with the arguments settled, so the hook wiring,
      # the RBAC and the timeout are reviewable now and S-12933 only has to add
      # the subcommand behind this path.
      #
      # Contract this Job assumes of `operator namespaced-cleanup`:
      #   --namespace <ns>        the only namespace it may act on
      #   --timeout <duration>    wall-clock budget; must exit before
      #                           activeDeadlineSeconds kills the pod
      #   --force                 exit 0 even when cleanup is incomplete
      #   exit 0 -> uninstall proceeds; non-zero -> `helm uninstall` fails and
      #   the release stays, unless --force was passed.
      #
      # Until S-12933 lands, an image without the subcommand exits non-zero,
      # which BLOCKS `helm uninstall` unless uninstall.forceCleanupOnUninstall
      # is set (default false) or uninstall.enabled is turned off.
      # ###################################################################
      - name: cleanup
        image: 'gcr.io/speedscale/operator:v2.5.878'
        imagePullPolicy: 'Always'
        command:
        - /speedscale/operator
        args:
        - namespaced-cleanup
        - --namespace
        - 'speedscale'
        - --timeout
        - '5m'
        env:
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: SPEEDSCALE_CLEANUP_TIMEOUT
          value: '5m'
        - name: SPEEDSCALE_FORCE_CLEANUP
          value: "false"
        envFrom:
        - secretRef:
            name: 'speedscale-apikey'
            # The API key Secret may already be gone when a namespace is being
            # torn down wholesale. Cleanup is local work and does not need it.
            optional: true
        resources:
          limits:
            cpu: "1"
            memory: 256M
          requests:
            cpu: 100m
            memory: 64M
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          privileged: false
          readOnlyRootFilesystem: true
          runAsGroup: 2100
          runAsNonRoot: true
          runAsUser: 2100
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp
          name: speedscale-diagnostics
      volumes:
      - emptyDir: {}
        name: speedscale-diagnostics

