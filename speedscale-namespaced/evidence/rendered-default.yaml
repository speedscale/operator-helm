---
# Source: speedscale-namespaced/templates/uninstall.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: speedscale-uninstall
  namespace: 'speedscale'
  labels:
    app: speedscale
    controlplane.speedscale.com/component: uninstall
  annotations:
    helm.sh/hook: pre-delete
    helm.sh/hook-weight: "2"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
# Deliberately NARROWER than the coordinator's Role, because an uninstall runs
# unattended at the least convenient moment:
#   * NO workload patch. It cannot touch a Deployment or StatefulSet spec. A
#     half-finished uninstall must not be able to leave a customer workload
#     mid-mutation.
#   * NO deletion of anything. Helm removes the release's own objects; this
#     hook's job is to signal in-flight replays to wind down and to record what
#     was left behind, not to garbage-collect.
rules:
# Signal in-flight replays through the same labeled ConfigMaps the replay API
# uses, and leave a record of anything that could not be wound down.
- apiGroups:
  - ""
  resources:
  - configmaps
  verbs:
  - get
  - list
  - watch
  - create
  - update
  - patch
# Read-only visibility to decide whether cleanup finished.
- apiGroups:
  - ""
  resources:
  - pods
  - services
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - apps
  resources:
  - deployments
  - statefulsets
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch

