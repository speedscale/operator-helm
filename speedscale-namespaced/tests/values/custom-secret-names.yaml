# Matrix case: bring-your-own everything.
#
# No Secret in this case is created by the chart: the API key and the TLS certs
# are pre-existing, externally managed objects referenced by name. This is the
# shape a customer with cert-manager / external-secrets actually installs, and
# it is where a template that hard-codes "speedscale-certs" or
# "speedscale-apikey" shows up as a dangling reference.
clusterName: byo-cluster
instanceID: byo-instance-id

apiKeySecret: acme-speedscale-credentials

inspector:
  serviceAccountName: acme-speedscale-inspector

replayRuntime:
  serviceAccountName: acme-speedscale-replay

capture:
  forwarderServiceName: acme-speedscale-forwarder

tls:
  create: false
  certsSecret: acme-speedscale-tls
  createJKS: true
  jksSecret: acme-speedscale-jks

secretAccessList:
- acme-db-credentials

uninstall:
  enabled: true
  cleanupTimeout: 90s

tenant:
  id: byo-tenant
  name: byo
  bucket: byo-bucket
  region: eu-west-1
  stream: byo-stream
