{{- if .Values.replayCoordinator.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: speedscale-replay-coordinator
  namespace: '{{ .Release.Namespace }}'
  labels:
    {{- with .Values.globalLabels }}
{{ toYaml . | indent 4 }}
    {{- end }}
    app: speedscale-replay-coordinator
    controlplane.speedscale.com/component: replay-coordinator
  {{- with .Values.globalAnnotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
data:
  # S-12919 config-key sync follow-up: every key below now matches a real
  # operator/settings field by exact name (uppercase(mapstructure tag), viper
  # AutomaticEnv) and has a genuine consumer in operator/replaycoordinator.
  # Renaming a key here without renaming the settings field produces a
  # coordinator that starts with defaults and silently instruments the wrong
  # Service -- keep the two in lockstep, and re-run
  # operator/settings.TestLoadConfig_NamespacedChartKeys after any rename.
  #
  # Three keys this ConfigMap used to render were deleted rather than synced,
  # because nothing on the operator side reads them today (see the S-12919
  # follow-up report for the grep trail): FORWARDER_SERVICE_NAME,
  # SIDECAR_ENABLE_DIAGNOSTICS, and SPEEDSCALE_CONTROL_PLANE_NAMESPACE (the
  # coordinator already learns its namespace from the POD_NAMESPACE
  # downward-API env var on the Deployment, below).
  CLUSTER_NAME: '{{ .Values.clusterName }}'
  LOG_LEVEL: '{{ .Values.logLevel }}'
  PROCESS_ID: '{{ include "speedscale.instanceID" . }}'
  CONTAINER_REGISTRY: '{{ .Values.image.registry }}'
  CONTAINER_TYPE: '{{ .Values.image.tag }}'
  IMAGE_PULL_POLICY: '{{ .Values.image.pullPolicy }}'
  # Names the installation provisioned. Config.Names exists precisely so a
  # namespaced install pins nothing to a cluster-wide default.
  API_KEY_SECRET_NAME: '{{ include "speedscale.apiKeySecretName" . }}'
  TLS_SECRET_NAME: '{{ include "speedscale.certsSecretName" . }}'
  {{- if .Values.tls.createJKS }}
  JKS_SECRET_NAME: '{{ .Values.tls.jksSecret | default "speedscale-jks" }}'
  {{- end }}
  # Capture wiring handed to instrumented workloads. capture.enableDiagnostics
  # is deliberately NOT rendered here: build.SidecarConfigOverride has no field
  # for it yet, so there is nowhere on the operator side for the value to land
  # (see capture.enableDiagnostics in values.yaml).
  SIDECAR_REINITIALIZE_IPTABLES: {{ .Values.capture.reinitializeIptables | quote }}
  # Loop timings (Go durations).
  RESYNC_INTERVAL: {{ .Values.replayCoordinator.resyncInterval | default "10s" | quote }}
  PROVISIONING_TIMEOUT: {{ .Values.replayCoordinator.provisioningTimeout | default "1m0s" | quote }}
  # Cloud-issued tenant identity; same S-12914 hole as the forwarder's.
  TENANT_ID: '{{ .Values.tenant.id }}'
  TENANT_NAME: '{{ .Values.tenant.name }}'
  SUB_TENANT_NAME: '{{ .Values.tenant.subTenantName | default "default" }}'
{{- end }}
